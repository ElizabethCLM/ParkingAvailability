spring.application.name=parking-api
server.port=8080

# Grand Poitiers real-time parking API
parking.providers.poitiers.url=https://data.grandpoitiers.fr/data-fair/api/v1/datasets/mobilites-stationnement-des-parkings-en-temps-reel/lines

# Paris API - real-time parking API
parking.providers.paris.url=https://opendata.paris.fr/api/explore/v2.1/catalog/datasets/stationnement-en-ouvrage/records?limit=20

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs